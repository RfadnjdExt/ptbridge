[package]
name = "ptmcp"
version = "0.1.0"
edition = "2021"

[dependencies]
ptmp = { path = "../ptmp" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
